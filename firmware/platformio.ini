; Firmware Auhono cho ESP32-C3. Xem README.md.
;
;   pio run -e esp32c3                 biên dịch
;   pio run -e esp32c3 -t upload       nạp firmware (KHÔNG xóa danh tính: phân vùng "ident" nằm ngoài ảnh nạp)
;   pio test -e native                 chạy test logic (auhono_core) trên máy tính
;
; Đổi server / phiên bản / chân GPIO bằng build_flags bên dưới (hoặc biến môi trường PLATFORMIO_BUILD_FLAGS).

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32@^6.9.0        ; Arduino-ESP32 2.0.x (IDF 4.4). Đã đối chiếu API với 2.0.17.
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Nhúng vào firmware: bộ CA gốc TLS (xác thực server) và khóa công khai kiểm chữ ký OTA.
board_build.embed_txtfiles =
    certs/roots.pem
    keys/ota_public.pem

extra_scripts = pre:tools/pio_pre.py

; Chỉ cần OneWire: scratchpad DS18B20 được đọc và kiểm tra trực tiếp (lib/auhono_core/.../ds18b20.cpp), không dùng DallasTemperature.
lib_deps =
    paulstoffregen/OneWire@^2.3.8

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall -Wextra
    ; ── Đổi các dòng này cho từng bản phát hành / từng bo mạch ──
    -DAUHONO_FW_VERSION=\"1.0.0\"
    -DAUHONO_SERVER_URL=\"https://auhono-server.example.workers.dev\"
    -DONEWIRE_PIN=4
    -DLED_PIN=8
    -DLED_ACTIVE_LOW=1
    -DBUTTON_PIN=9
    ; Serial qua cổng USB gốc của ESP32-C3 (đa số bo C3 nhỏ không có chip USB-UART riêng)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Log của thư viện Arduino: 0 = tắt. KHÔNG bật (>0) cho bản giao khách: có thể in SSID/header HTTP (X-Signature) ra serial.
    -DCORE_DEBUG_LEVEL=0
    ; Nguồn yếu (cục sạc rẻ) gây brownout/reset? Giảm công suất phát Wi-Fi để giảm dòng đỉnh (đổi lại tầm sóng ngắn hơn).
    ; Firmware tự giảm xuống 8,5 dBm ở lần chạy sau khi phát hiện brownout; bỏ comment dòng dưới để giảm thường trực:
    ; -DAUHONO_WIFI_TX_POWER=WIFI_POWER_11dBm
    ; CHỈ khi phát triển với server cục bộ tự ký. Mặc định TẮT; bản phát hành KHÔNG được bật:
    ; -DALLOW_INSECURE_TLS
    ; CHỈ khi phát triển: cho phép Wi-Fi cấu hình MỞ khi thiếu danh tính (mặc định bản phát hành luôn WPA2 hoặc không mở AP):
    ; -DALLOW_OPEN_AP

; Test trên máy tính: chỉ biên dịch lib/auhono_core + test/, không cần Arduino.
[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_ldf_mode = deep+
build_flags =
    -std=gnu++17
    -Wall -Wextra
    -g
